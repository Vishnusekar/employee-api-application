apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-platform.postgres.service.fullname" . }}
  labels:
    {{- include "employee-platform.labels" (dict "root" . "component" "database") | nindent 4 }}
spec:
  selector:
    {{- include "employee-platform.selectorLabels" (dict "root" . "component" "database") | nindent 4 }}
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
  type: ClusterIP