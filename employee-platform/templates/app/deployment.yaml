apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "employee-platform.fullname" . }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ include "employee-platform.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "employee-platform.fullname" . }}
    spec:
      containers:
        - name: {{ include "employee-platform.fullname" . }}
          image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
          imagePullPolicy: {{ .Values.app.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ printf "%s-config" (include "employee-platform.fullname" .) }}
            - secretRef:
                name: {{ printf "%s-secret" (include "employee-platform.fullname" .) }}
          ports:
            - containerPort: {{ .Values.app.image.container.port }}
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.app.image.container.port }}
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.app.image.container.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.app.image.container.port }}
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 20