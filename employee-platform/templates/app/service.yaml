apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-platform.service.fullname" . }}
  labels:
    {{- include "employee-platform.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "employee-platform.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.image.container.port }}