apiVersion: v1
kind: Service
metadata:
  name: {{ include "employee-platform.service.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "employee-platform.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.app.image.container.port }}