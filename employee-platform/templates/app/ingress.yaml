{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "employee-platform.fullname" . }}
  labels:
    {{- include "employee-platform.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "employee-platform.service.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
      {{- end }}
{{- end }}