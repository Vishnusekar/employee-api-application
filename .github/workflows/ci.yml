name: CI

on:
  push:
    branches:
      - main
      - release-2.1-CI-pipeline

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          docker build -t employee-api:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d \
          --name employee-api \
          -p 8000:8000 \
          employee-api:${{ github.sha }}

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health/live; then
              exit 0
            fi
            sleep 2
          done

          docker logs employee-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop employee-api || true
          docker rm employee-api || true