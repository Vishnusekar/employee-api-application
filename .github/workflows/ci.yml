name: CI

on:
  push:
    branches:
      - main
      - release-2.1-CI-pipeline

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employee
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d employee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker build \
            -t ghcr.io/${IMAGE_OWNER}}/employee-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker push ghcr.io/${IMAGE_OWNER}/employee-api:${{ github.sha }}

      - name: Run Docker container
        run: |
          docker run -d \
            --name employee-api \
            --add-host=host.docker.internal:host-gateway \
            -p 8000:8000 \
            -e DATABASE_HOST=host.docker.internal \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=employee \
            -e DATABASE_USERNAME=ci_user \
            -e DATABASE_PASSWORD=ci_password \
            -e APP_NAME="Employee API" \
            -e ENVIRONMENT="CI" \
            -e STARTUP_DELAY=0 \
            -e FAIL_AFTER=0 \
            ghcr.io/${{ github.repository_owner }}/employee-api:${{ github.sha }}
          
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs employee-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop employee-api || true
          docker rm employee-api || true