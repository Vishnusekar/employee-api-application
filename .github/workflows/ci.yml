name: CI

on:
  push:
    branches:
      - main
      - release-2.1-CI-pipeline

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: employee
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d employee"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/employee-api:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Validate Helm chart
        run: |
          helm lint employee-platform

      - name: Set up Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: employee-api-ci

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME" \
            .

      - name: Load Docker image into Kind
        run: |
          kind load docker-image "$IMAGE_NAME" --name employee-api-ci

      - name: Install Prometheus Operator CRDs
        run: |
          kubectl apply -f https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml

      - name: Deploy Helm chart
        run: |
          helm upgrade --install employee-platform ./employee-platform \
            --set app.image.repository="${IMAGE_NAME%:*}" \
            --set app.image.tag="${IMAGE_NAME##*:}"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME"

      - name: Run Docker container
        run: |
          docker run -d \
            --name employee-api \
            --add-host=host.docker.internal:host-gateway \
            -p 8000:8000 \
            -e DATABASE_HOST=host.docker.internal \
            -e DATABASE_PORT=5432 \
            -e DATABASE_NAME=employee \
            -e DATABASE_USERNAME=ci_user \
            -e DATABASE_PASSWORD=ci_password \
            -e APP_NAME="Employee API" \
            -e ENVIRONMENT="CI" \
            -e STARTUP_DELAY=0 \
            -e FAIL_AFTER=0 \
            "$IMAGE_NAME"
          
      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done

          docker logs employee-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop employee-api || true
          docker rm employee-api || true